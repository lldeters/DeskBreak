# Gradle
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# AGP 9 bringt Kotlin eingebaut mit; KSP registriert seine generierten Quellen
# ueber Kotlin-Source-Sets und braucht deshalb diese Freigabe.
android.disallowKotlinSourceSets=false
ksp.useKSP2=true

# Version beider Apps (Uhr :app und Handy :mobile), einzige Stelle zum Hochzaehlen, siehe
# docs/play-store/signing-and-build.md. Play verlangt je hochgeladenem Bundle einen eigenen versionCode:
# Handy = deskbreak.versionCode * 10 + 1, Uhr = deskbreak.versionCode * 10 + 2.
deskbreak.versionName=1.0.0
deskbreak.versionCode=1
